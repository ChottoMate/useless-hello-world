services:
  gateway:
    build: ./gateway-service
    ports:
      - "8080:8080"
    environment:
      - HELLO_URL=http://hello:8080/hello
      - WORLD_URL=http://world:8080/world
    depends_on:
      - hello
      - world

  hello:
    build: ./hello-service
    ports:
      - "8081:8080"

  world:
    build: ./world-service
    ports:
      - "8082:8080"

  grafana:
    build: ./grafana
    ports:
      - "3000:3000"